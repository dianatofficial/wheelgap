name: Bug hunt

# Weekly: run scripts/check_projects.py repo over the 20 public repositories in
# scripts/bug_hunt_repos.txt and file one deduplicated issue per real disagreement (#777).

on:
  schedule:
    - cron: "17 8 * * 2" # Tuesdays
  workflow_dispatch:
    inputs:
      file_issues:
        description: "File GitHub issues for disagreements (keep false on forks)"
        type: boolean
        required: false
        default: false
      targets:
        description: "Optional comma-separated target labels (blank uses default targets)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-hunt
  cancel-in-progress: false

jobs:
  bug-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python versions used by default targets
        run: uv python install 3.13 3.15
      - name: Check repositories
        # Each repo's exit code is recorded, not hidden: 0 all agree, 1 a disagreement, anything else couldn't be
        # checked, which the next step shows as an "error" row and fails the job on. The token is only for
        # api.github.com (rate limits on shared runners); check_projects.py never passes it to a referee.
        env:
          INPUT_TARGETS: ${{ inputs.targets }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bug-hunt-results
          : > bug-hunt-results/status.tsv
          target_args=()
          if [ -n "$INPUT_TARGETS" ]; then
            IFS=',' read -ra raw_targets <<< "$INPUT_TARGETS"
            for t in "${raw_targets[@]}"; do
              t_trimmed="$(echo "$t" | xargs)"
              [ -n "$t_trimmed" ] && target_args+=(-t "$t_trimmed")
            done
          fi
          while IFS= read -r repo || [ -n "$repo" ]; do
            repo="${repo%%#*}"
            repo="$(echo "$repo" | xargs)"
            [ -z "$repo" ] && continue
            safe="${repo//\//__}"
            echo "::group::$repo"
            code=0
            uv run --python 3.14 --no-dev --with pip python scripts/check_projects.py repo "$repo" \
              "${target_args[@]}" --issues-json "bug-hunt-results/${safe}.json" || code=$?
            printf '%s\t%s\n' "$repo" "$code" >> bug-hunt-results/status.tsv
            echo "::endgroup::"
          done < scripts/bug_hunt_repos.txt
      - name: File deduplicated issues and write the job summary
        # scripts/bug_hunt_file.py: creates the bug-hunt label, dedups against open and closed issues (and files
        # nothing if it can't list them), files at most 5 per run, and fails the job on any of that or on a repo
        # that couldn't be checked.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHOULD_FILE: ${{ (github.event_name == 'schedule' && github.repository == 'wheelgap/wheelgap') || inputs.file_issues }}
        run: |
          file_flag=()
          if [ "$SHOULD_FILE" = "true" ]; then
            file_flag=(--file)
          fi
          uv run --python 3.14 --no-dev python scripts/bug_hunt_file.py bug-hunt-results "${file_flag[@]}"
